spring:
  config:
    import: optional:file:./config/application-dev-local.yml
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/pikdo
    username: pikdo

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

server:
  servlet:
    session:
      cookie:
        name: PIKDOSESSION
        secure: false

pikdo:
  auth:
    smtp-host: localhost
    smtp-port: 1025
    mail-from: noreply@pikdo.invalid
