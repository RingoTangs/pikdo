spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    embedded-database-connection: none
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      flush-mode: immediate
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
  web:
    locale: en
  messages:
    encoding: UTF-8
    fallback-to-system-locale: false
  application:
    name: pikdo-server

server:
  forward-headers-strategy: none
  port: 8080
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        name: __Host-PIKDOSESSION
        http-only: true
        secure: true
        same-site: lax
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"

mybatis:
  configuration:
    map-underscore-to-camel-case: true

pikdo:
  auth:
    mail-workers: 2
    mail-queue-capacity: 100
    trusted-proxies: []
    hmac-key: ${PIKDO_AUTH_HMAC_KEY:}
    smtp-host: ${PIKDO_AUTH_SMTP_HOST:}
    smtp-port: ${PIKDO_AUTH_SMTP_PORT:587}
    smtp-username: ${PIKDO_AUTH_SMTP_USERNAME:}
    smtp-password: ${PIKDO_AUTH_SMTP_PASSWORD:}
    mail-from: ${PIKDO_AUTH_MAIL_FROM:}
