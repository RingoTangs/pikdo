# Optional fresh local environment. Existing PostgreSQL users need not start this service.
name: pikdo-database
services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pikdo}
      POSTGRES_USER: ${POSTGRES_USER:-pikdo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a non-empty local database password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
volumes:
  postgres_data:
