[project]
name = "collector"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RingoTangs", email = "singrainyang@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.144.0",
    "httpx>=0.28.1",
    "pydantic>=2.12.0",
    "playwright>=1.64.0",
    "selectolax>=1.0.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
dev = "app:main"
test = "pytest:main"
lint = "tooling:lint"
format = "tooling:format"
collect-examples = "xhs.example_collector:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["app", "tooling"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
    "mdformat>=1,<2",
    "mdformat-gfm",
    "simplejson>=3.19",
]

[tool.ruff]
target-version = "py313"
line-length = 100
force-exclude = true
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
