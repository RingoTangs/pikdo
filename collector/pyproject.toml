[project]
name = "collector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RingoTangs", email = "singrainyang@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.144.0",
    "httpx>=0.28.1",
    "playwright>=1.64.0",
    "selectolax>=1.0.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
dev = "main:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
